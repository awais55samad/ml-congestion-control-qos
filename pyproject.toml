[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qos-control"
version = "0.1.0"
description = "Adaptive machine-learning-style congestion control for QoS enhancement in bandwidth-constrained networks"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
qos-control = "qos_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
